# The name that appears in the "Actions" tab on GitHub and in the checks of each PR.
name: CI

# ── TRIGGER ─────────────────────────────────────────────────────────────
# When this workflow runs. Here: on each push to main and each Pull Request
# that points to main. This way you see the green/red check before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 — BACKEND (Laravel)
  # Runs on a clean Ubuntu machine. Starts Postgres and Redis as "services"
  # (same concept as docker-compose), installs PHP, and runs the tests.
  # ══════════════════════════════════════════════════════════════════════════
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    # Default directory for this job's commands: Laravel lives in ./backend.
    defaults:
      run:
        working-directory: backend

    # ── SERVICES ──────────────────────────────────────────────────────────
    # Containers that run ALONGSIDE the job, on the same machine. Same idea as
    # the `services:` in your docker-compose. The difference: since the app runs
    # directly on the runner (not in a container), it reaches these services via
    # 127.0.0.1 on the ports mapped below — NOT via "postgres"/"redis".
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devmind_test
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        # Healthcheck: the job waits for Postgres to be ready before continuing.
        options: --health-cmd="pg_isready -U devmind" --health-interval=5s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      # Download the code from the repository into the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Install PHP 8.3 with the same extensions your Dockerfile installs.
      # (setup-php is the community's default action for this.)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, redis, intl, bcmath, zip
          coverage: none

      # Cache Composer dependencies to make CI faster on subsequent runs.
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Recreate the environment: copy .env.example and generate the APP_KEY.
      # In CI, your real .env doesn't exist (it never goes to Git), so we build one.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Migrate the test database. RefreshDatabase alone is not reliable here:
      # this runs against the real Postgres service, so the schema must exist
      # before any test starts (each artisan invocation is its own process,
      # so the env vars must be repeated on every step that touches the DB).
      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: devmind_test
          DB_USERNAME: devmind
          DB_PASSWORD: secret
        run: php artisan migrate --force

      # Run the tests. The variables here OVERRIDE the .env for this step only,
      # pointing to the services via 127.0.0.1 and forcing the "fake" AI driver
      # (no test spends the OpenAI key).
      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: devmind_test
          DB_USERNAME: devmind
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          QUEUE_CONNECTION: sync
          AI_PROVIDER: fake
        run: php artisan test

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 — FRONTEND (React + TypeScript)
  # Runs in parallel with the backend. Lint and build.
  # ══════════════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci = clean, reproducible install from the package-lock (ideal for CI).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
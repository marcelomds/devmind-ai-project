services:
  # Web server: public entrypoint on port 80, forwards PHP requests
  # to the app container via FastCGI.
  nginx:
    image: nginx:alpine
    container_name: devmind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - devmind

  # Application runtime: PHP-FPM built from the existing Dockerfile.
  # No published ports — only nginx talks to it.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: devmind-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
    networks:
      - devmind

  # Queue worker: processes RunAnalysis jobs off the Redis queue.
  # Same image as app, different command.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: devmind-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
    networks:
      - devmind

  # Cache, sessions and queue broker. Internal only — no published ports.
  redis:
    image: redis:7-alpine
    container_name: devmind-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - devmind

networks:
  devmind:

volumes:
  redis_data:
